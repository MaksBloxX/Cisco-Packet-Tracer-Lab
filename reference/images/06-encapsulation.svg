<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680"><defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#387e8e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#c77243"/></marker></defs><rect width="900" height="680" rx="20" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="38" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">ENCAPSULATION: INFORMATION AROUND INFORMATION</text><rect x="35" y="80" width="830" height="465" rx="12" fill="#d4e4e7"/><text x="57" y="110" font-size="17" fill="#173343" text-anchor="start" font-weight="bold">LINK FRAME</text><rect x="80" y="155" width="740" height="335" rx="12" fill="#afcdd4"/><text x="102" y="185" font-size="17" fill="#173343" text-anchor="start" font-weight="bold">IP PACKET</text><rect x="125" y="230" width="650" height="205" rx="12" fill="#78a9b5"/><text x="147" y="260" font-size="17" fill="#ffffff" text-anchor="start" font-weight="bold">TCP SEGMENT</text><rect x="170" y="305" width="560" height="75" rx="12" fill="#173343"/><text x="192" y="335" font-size="17" fill="#ffffff" text-anchor="start" font-weight="bold">TLS-PROTECTED APPLICATION DATA</text><text x="450" y="395" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="normal">TCP ports + sequence information</text><text x="450" y="455" font-size="16" fill="#173343" text-anchor="middle" font-weight="normal">Source IP + destination IP + TTL</text><text x="450" y="515" font-size="16" fill="#173343" text-anchor="middle" font-weight="normal">Local link header + payload + error-check information</text><text x="450" y="590" font-size="16" fill="#173343" text-anchor="middle" font-weight="normal">Sender adds protocol structure → Receiver processes it in reverse.</text><text x="450" y="622" font-size="15" fill="#173343" text-anchor="middle" font-weight="normal">Conceptual TCP/HTTPS example; sizes are not to scale.</text><text x="450" y="648" font-size="15" fill="#173343" text-anchor="middle" font-weight="normal">One HTTP message may span many segments, packets and frames.</text></g></svg>