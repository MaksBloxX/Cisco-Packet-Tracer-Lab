<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670"><defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#387e8e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#c77243"/></marker></defs><rect width="900" height="670" rx="20" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="38" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">ROUTING: LOCAL MAC CHANGES AT EACH ETHERNET HOP</text><rect x="25" y="82" width="160" height="86" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="105.0" y="116" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">PC</text><text x="105.0" y="143" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">IP 192.0.2.10</text><rect x="255" y="82" width="160" height="86" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="335.0" y="116" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Router A</text><text x="335.0" y="143" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Ingress / egress</text><rect x="485" y="82" width="160" height="86" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="565.0" y="116" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Router B</text><text x="565.0" y="143" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Ingress / egress</text><rect x="715" y="82" width="160" height="86" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="795.0" y="116" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Server</text><text x="795.0" y="143" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">IP 203.0.113.20</text><path d="M185 125 L255 125" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><path d="M415 125 L485 125" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><path d="M645 125 L715 125" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><rect x="40" y="220" width="820" height="95" rx="10" fill="#eef4f4" stroke="#a8c0c7"/><text x="62" y="246" font-size="17" fill="#173343" text-anchor="start" font-weight="bold">LINK 1: PC → Router A</text><text x="62" y="272" font-size="15" fill="#173343" text-anchor="start" font-weight="normal">MAC: PC → Router A ingress</text><text x="62" y="297" font-size="15" fill="#387e8e" text-anchor="start" font-weight="normal">IP: 192.0.2.10 → 203.0.113.20</text><text x="835" y="297" font-size="15" fill="#c77243" text-anchor="end" font-weight="normal">Example TTL: 64</text><rect x="40" y="340" width="820" height="95" rx="10" fill="#eef4f4" stroke="#a8c0c7"/><text x="62" y="366" font-size="17" fill="#173343" text-anchor="start" font-weight="bold">LINK 2: Router A → Router B</text><text x="62" y="392" font-size="15" fill="#173343" text-anchor="start" font-weight="normal">MAC: Router A egress → Router B ingress</text><text x="62" y="417" font-size="15" fill="#387e8e" text-anchor="start" font-weight="normal">IP: 192.0.2.10 → 203.0.113.20</text><text x="835" y="417" font-size="15" fill="#c77243" text-anchor="end" font-weight="normal">Example TTL: 63</text><rect x="40" y="460" width="820" height="95" rx="10" fill="#eef4f4" stroke="#a8c0c7"/><text x="62" y="486" font-size="17" fill="#173343" text-anchor="start" font-weight="bold">LINK 3: Router B → Server</text><text x="62" y="512" font-size="15" fill="#173343" text-anchor="start" font-weight="normal">MAC: Router B egress → Server</text><text x="62" y="537" font-size="15" fill="#387e8e" text-anchor="start" font-weight="normal">IP: 192.0.2.10 → 203.0.113.20</text><text x="835" y="537" font-size="15" fill="#c77243" text-anchor="end" font-weight="normal">Example TTL: 62</text><text x="450" y="605" font-size="16" fill="#173343" text-anchor="middle" font-weight="normal">Teaching example: three Ethernet links, no NAT or tunnelling.</text><text x="450" y="630" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Addresses are documentation examples. Real paths can use other link types.</text></g></svg>