<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#387e8e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#c77243"/></marker></defs><rect width="900" height="650" rx="20" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="40" font-size="22" fill="#173343" text-anchor="middle" font-weight="bold">ONE SEARCH, TWO DIRECTIONS</text><rect x="25" y="145" width="160" height="95" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="105.0" y="179" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Browser</text><text x="105.0" y="206" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Your device</text><rect x="255" y="145" width="160" height="95" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="335.0" y="179" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Home router</text><text x="335.0" y="206" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Gateway / Wi-Fi AP</text><rect x="485" y="145" width="160" height="95" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="565.0" y="179" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Internet</text><text x="565.0" y="206" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Many routed links</text><rect x="715" y="145" width="160" height="95" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="795.0" y="179" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Web service</text><text x="795.0" y="206" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Search frontend</text><path d="M185 175 L255 175" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><path d="M415 175 L485 175" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><path d="M645 175 L715 175" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><text x="450" y="110" font-size="18" fill="#387e8e" text-anchor="middle" font-weight="normal">1  REQUEST: search query travels toward the service</text><path d="M790 315 L100 315" fill="none" stroke="#c77243" stroke-width="3" marker-end="url(#a1)"/><text x="445.0" y="346.0" font-size="14" fill="#c77243" text-anchor="middle" font-weight="normal">2  RESPONSE: document / data travels back</text><rect x="65" y="410" width="350" height="90" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="240.0" y="444" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Before the request</text><text x="240.0" y="471" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">DNS + secure connection may be needed</text><rect x="485" y="410" width="350" height="90" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="660.0" y="444" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">After the response</text><text x="660.0" y="471" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Browser may request CSS, JS and images</text><text x="450" y="570" font-size="17" fill="#173343" text-anchor="middle" font-weight="normal">Return traffic may use a different network route.</text><text x="450" y="600" font-size="15" fill="#173343" text-anchor="middle" font-weight="normal">A server endpoint can decrypt HTTPS; transit routers normally cannot.</text></g></svg>