<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730"><defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#387e8e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#c77243"/></marker></defs><rect width="900" height="730" rx="20" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="21" fill="#173343" text-anchor="middle" font-weight="bold">NEW HTTPS CONNECTION: TCP + TLS EXAMPLE</text><rect x="35" y="58" width="210" height="64" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="140.0" y="92" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Browser / OS</text><path d="M140 122 V650" stroke="#b5c8cd" stroke-width="2" stroke-dasharray="7 6"/><rect x="345" y="58" width="210" height="64" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="450.0" y="92" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">DNS resolver</text><path d="M450 122 V650" stroke="#b5c8cd" stroke-width="2" stroke-dasharray="7 6"/><rect x="655" y="58" width="210" height="64" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="760.0" y="92" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Web server</text><path d="M760 122 V650" stroke="#b5c8cd" stroke-width="2" stroke-dasharray="7 6"/><path d="M140 170 L450 170" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><text x="295.0" y="157.0" font-size="14" fill="#387e8e" text-anchor="middle" font-weight="normal">1  DNS question</text><path d="M450 225 L140 225" fill="none" stroke="#c77243" stroke-width="3" marker-end="url(#a1)"/><text x="295.0" y="212.0" font-size="14" fill="#c77243" text-anchor="middle" font-weight="normal">2  IP address answer</text><path d="M140 300 L760 300" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><text x="450.0" y="287.0" font-size="14" fill="#387e8e" text-anchor="middle" font-weight="normal">3  TCP handshake (SYN / SYN-ACK / ACK)</text><path d="M760 328 L140 328" fill="none" stroke="#c77243" stroke-width="3" marker-end="url(#a1)"/><path d="M140 385 L760 385" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><text x="450.0" y="372.0" font-size="14" fill="#387e8e" text-anchor="middle" font-weight="normal">4  TLS handshake: identity + keys</text><path d="M760 413 L140 413" fill="none" stroke="#c77243" stroke-width="3" marker-end="url(#a1)"/><path d="M140 470 L760 470" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><text x="450.0" y="457.0" font-size="14" fill="#387e8e" text-anchor="middle" font-weight="normal">5  Encrypted HTTP request</text><path d="M760 555 L140 555" fill="none" stroke="#c77243" stroke-width="3" marker-end="url(#a1)"/><text x="450.0" y="542.0" font-size="14" fill="#c77243" text-anchor="middle" font-weight="normal">6  Encrypted HTTP response</text><text x="450" y="695" font-size="15" fill="#173343" text-anchor="middle" font-weight="normal">Simplified exchange: handshake stages contain multiple messages.</text></g></svg>