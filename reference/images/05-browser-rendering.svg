<svg xmlns="http://www.w3.org/2000/svg" width="900" height="655" viewBox="0 0 900 655"><defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#387e8e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#c77243"/></marker></defs><rect width="900" height="655" rx="20" fill="#f7faf9"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="40" font-size="23" fill="#173343" text-anchor="middle" font-weight="bold">FROM A RESPONSE TO A VISIBLE PAGE</text><rect x="290" y="70" width="320" height="80" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="450.0" y="104" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">HTTP response</text><text x="450.0" y="131" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">HTML document (example)</text><path d="M450 150 L450 200" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><rect x="290" y="205" width="320" height="75" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="450.0" y="239" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">HTML parser</text><text x="450.0" y="266" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Builds the DOM; discovers resources</text><path d="M450 280 L155 337" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><rect x="30" y="342" width="250" height="80" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="155.0" y="376" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">CSS</text><text x="155.0" y="403" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Styles / CSSOM</text><path d="M450 280 L450 337" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><rect x="325" y="342" width="250" height="80" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="450.0" y="376" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">JavaScript</text><text x="450.0" y="403" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Runs; may update DOM or fetch data</text><path d="M450 280 L745 337" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><rect x="620" y="342" width="250" height="80" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="745.0" y="376" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Images / fonts</text><text x="745.0" y="403" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Additional resource requests</text><path d="M155 422 L450 477" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><path d="M450 422 L450 477" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><path d="M745 422 L450 477" fill="none" stroke="#387e8e" stroke-width="3" marker-end="url(#a0)"/><rect x="255" y="482" width="390" height="90" rx="14" fill="#eef4f4" stroke="#a8c0c7"/><text x="450.0" y="516" font-size="20" fill="#173343" text-anchor="middle" font-weight="bold">Layout → Paint → Composite</text><text x="450.0" y="543" font-size="14" fill="#173343" text-anchor="middle" font-weight="normal">Pixels are shown on your screen</text><text x="450" y="620" font-size="16" fill="#173343" text-anchor="middle" font-weight="normal">Loading, script execution and rendering can overlap and repeat.</text></g></svg>